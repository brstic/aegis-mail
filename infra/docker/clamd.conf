# Replaces the image's clamd.conf. AlertExceedsMax is the reason this file exists: without it, clamd answers OK for a file
# past MaxFileSize or MaxScanSize that it didn't read. ClamdScanner reports that alert as "unscannable", never "clean".
LogTime yes
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
AlertExceedsMax yes
# The product takes messages up to 50 MB, so a whole message always fits.
StreamMaxLength 64M
MaxFileSize 64M
MaxScanSize 256M
