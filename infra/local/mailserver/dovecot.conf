dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
protocols = imap pop3 lmtp
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout

ssl = required
ssl_server_cert_file = /etc/mail-test/server.crt
ssl_server_key_file = /etc/mail-test/server.key

auth_mechanisms = plain login
auth_username_format = %{user | lower}
passdb passwd-file {
  passwd_file_path = /etc/mail-test/passwd
}
userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /var/vmail/%{user}
    mail_path = /var/vmail/%{user}/Maildir
  }
}
mail_driver = maildir

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
protocol pop3 {
  pop3_uidl_format = %{uid | hex(8)}%{uidvalidity | hex(8)}
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = "\\Drafts"
    auto = subscribe
  }
  mailbox Sent {
    special_use = "\\Sent"
    auto = subscribe
  }
  mailbox Junk {
    special_use = "\\Junk"
    auto = subscribe
  }
  mailbox Trash {
    special_use = "\\Trash"
    auto = subscribe
  }
  mailbox Archive {
    special_use = "\\Archive"
    auto = subscribe
  }
  # The \All flag on an ordinary folder, to prove these views are left out of sync.
  mailbox "All Mail" {
    special_use = "\\All"
    auto = create
  }
}
