name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
    validations: { required: false }
